spring.application.name=Projeto

# Sobrescreve com application-local.properties (nao versionado) se ele existir
spring.config.import=optional:application-local.properties

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ProjetoAcademia}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
# auto-logout: token para de autenticar apos esse tempo sem nenhuma requisicao
app.jwt.idle-timeout-minutes=${JWT_IDLE_TIMEOUT_MINUTES:30}
